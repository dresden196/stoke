# Stoke as a Flatpak: the KDE window plus the engine and every tool it
# shells out to, built from source. No root: the engine talks to udisks2
# over the system bus (polkit asks once when the drive is opened), formats
# by writing file-system images it built itself, and installs Syslinux and
# GRUB by hand. See stoke/stoke/backend.py. The window sees can_write in
# the engine's hello and never reaches for pkexec, so no polkit action
# file goes in here.
#
# The 6.11 KDE runtime carries KDE Frameworks 6.28 along with Qt 6.11, so
# Kirigami, KI18n and the org.kde.desktop QQC2 style (with its KIconThemes
# and KColorScheme integration) come from the runtime; the SDK has ECM for
# the window's CMake. What the runtime lacks for the engine is PyGObject,
# built below. The GNOME window ships as io.github.dresden196.stoke.gtk
# (see the .gtk.yml next to this one); both may be installed side by side.
#
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.dresden196.stoke.yml
app-id: io.github.dresden196.stoke
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: stoke-qt
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The drive: opened, rescanned and mounted through udisks2.
  - --system-talk-name=org.freedesktop.UDisks2
  # Where udisks2 mounts the fresh volumes so the engine can fill them.
  - --filesystem=/run/media:rw
  - --filesystem=/media:rw
  # Images live anywhere on the host; the file chooser portal hands over
  # single files, this lets a path typed or passed on the command line work.
  - --filesystem=host:ro
  - --env=QT_QPA_PLATFORM=wayland;xcb
  - --env=PYTHONPATH=/app/lib/python3/site-packages
  - --env=STOKE_LIB=/app/lib/stoke
  - --env=STOKE_PAYLOAD=/app/share/stoke
  - --env=STOKE_GRUB_DIR=/app/lib/grub/i386-pc
  - --env=STOKE_ENGINE=/app/bin/stoke
  - --env=STOKE_LOCALE_DIR=/app/share/locale
  - --env=STOKE_SYSLINUX=/app/share/stoke/syslinux
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/info
  - /share/doc
  - '*.la'
  - '*.a'
modules:
  # ------------------------------------------------------------- Engine tools
  - name: pygobject
    # The engine's udisks2 backend speaks D-Bus through Gio (import gi). The
    # KDE runtime has python3 (3.13), GLib 2.84 and the Gio typelibs but not
    # PyGObject; built against the runtime's python3, without pycairo.
    buildsystem: meson
    config-opts: [-Dpycairo=disabled, -Dtests=false]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pygobject/3.58/pygobject-3.58.0.tar.gz
        sha256: 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca
  - name: zstd
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS -C programs zstd
      - install -Dm755 programs/zstd /app/bin/zstd
    sources:
      - type: archive
        url: https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
        sha256: eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
  - name: dosfstools
    config-opts: [--enable-compat-symlinks, --sbindir=/app/bin]
    sources:
      - type: archive
        url: https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz
        sha256: 64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527
  - name: exfatprogs
    config-opts: [--sbindir=/app/bin]
    sources:
      - type: archive
        url: https://github.com/exfatprogs/exfatprogs/releases/download/1.2.9/exfatprogs-1.2.9.tar.xz
        sha256: d9a42197c6ff9e6a8e923789413008e317415cf7a4ab85c486c5ffcaf49ca175
  - name: e2fsprogs
    config-opts: [--sbindir=/app/bin, --disable-fsck, --disable-e2initrd-helper, --disable-libblkid, --disable-libuuid, --disable-uuidd, --disable-fuse2fs, --disable-nls]
    sources:
      - type: archive
        url: https://www.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.xz
        sha256: 08242e64ca0e8194d9c1caad49762b19209a06318199b63ce74ae4ef2d74e63c
  - name: ntfs-3g
    # mkntfs, ntfslabel and libntfs-3g (wimlib applies Windows To Go through it).
    config-opts: [--sbindir=/app/bin, --disable-ldconfig, --disable-ntfs-3g, --disable-plugins, --disable-mtab, --disable-crypto, --enable-extras]
    # Its install hook moves the library to /lib; keep it under /app.
    make-install-args: [rootlibdir=/app/lib]
    sources:
      - type: archive
        url: https://tuxera.com/opensource/ntfs-3g_ntfsprogs-2022.10.3.tgz
        sha256: f20e36ee68074b845e3629e6bced4706ad053804cbaf062fbae60738f854170c
  - name: wimlib
    config-opts: [--without-fuse, --with-ntfs-3g]
    sources:
      - type: archive
        url: https://wimlib.net/downloads/wimlib-1.14.4.tar.gz
        sha256: 3633db2b6c8b255eb86d3bf3df3059796bd1f08e50b8c9728c7eb66662e51300
  - name: hivex
    # The registry editor (TPM bypass keys, BCD stores); python bindings on.
    config-opts: [--disable-ocaml, --disable-perl, --disable-ruby, --enable-python, --with-python-installdir=/app/lib/python3/site-packages]
    sources:
      - type: archive
        url: https://download.libguestfs.org/hivex/hivex-1.3.24.tar.gz
        sha256: a52fa45cecc9a78adb2d28605d68261e4f1fd4514a778a5473013d2ccc8a193c
  - name: grub
    # BIOS GRUB for Linux images: grub-mkimage plus the i386-pc modules.
    config-opts:
      - --with-platform=pc
      - --target=i386
      - --disable-grub-mkfont
      - --disable-grub-themes
      - --disable-efiemu
      - --disable-device-mapper
      - --disable-liblzma
      - --disable-werror
      - --disable-nls
      - --with-bootdir=/app/boot
    build-options:
      # The SDK's hardening flags (-fcf-protection and friends) are not
      # valid for the freestanding 32-bit boot modules.
      cflags: -O2
      cflags-override: true
      ldflags: ''
      ldflags-override: true
      env:
        # freetype/unifont are for grub-mkfont and themes, both off.
        FREETYPE: 'false'
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/grub/grub-2.12.tar.xz
        sha256: f3c97391f7c4eaa677a78e090c7e97e6dc47b16f655f04683ebd37bef7fe0faa
      - type: shell
        commands:
          # The 2.12 tarball ships without this generated file (upstream bug).
          - echo 'depends bli part_gpt' > grub-core/extra_deps.lst
  # ---------------------------------------------------- Stoke: engine + window
  - name: stoke
    # The window is built with CMake from stoke-qt/app (its .po catalogs are
    # picked up from the sibling stoke-qt/po by ki18n_install); the engine,
    # its payload and its catalogs are copied in afterwards, as in the GTK
    # manifest.
    buildsystem: cmake-ninja
    builddir: true
    subdir: stoke-qt/app
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    # post-install runs inside the subdir's build tree; the engine and the
    # desktop bits are addressed from the module root, which flatpak-builder
    # exports as FLATPAK_BUILDER_BUILDDIR.
    post-install:
      - cd "$FLATPAK_BUILDER_BUILDDIR" && install -d /app/lib/stoke /app/share/stoke
      - cd "$FLATPAK_BUILDER_BUILDDIR" && cp -r stoke/stoke /app/lib/stoke/
      - cd "$FLATPAK_BUILDER_BUILDDIR" && cp -r stoke/payload/. /app/share/stoke/
      - cd "$FLATPAK_BUILDER_BUILDDIR" && install -Dm755 stoke/bin/stoke /app/bin/stoke
      - cd "$FLATPAK_BUILDER_BUILDDIR" && for po in stoke/po/*/stoke.po; do lang=$(basename $(dirname $po)); install -d /app/share/locale/$lang/LC_MESSAGES; msgfmt -o /app/share/locale/$lang/LC_MESSAGES/stoke.mo $po; done
      - cd "$FLATPAK_BUILDER_BUILDDIR" && install -Dm644 stoke/icons/stoke.svg /app/share/icons/hicolor/scalable/apps/io.github.dresden196.stoke.svg
      - cd "$FLATPAK_BUILDER_BUILDDIR" && for png in stoke/icons/hicolor/*/apps/stoke.png; do size=$(basename "$(dirname "$(dirname "$png")")"); install -Dm644 "$png" /app/share/icons/hicolor/$size/apps/io.github.dresden196.stoke.png; done
      - cd "$FLATPAK_BUILDER_BUILDDIR" && install -d /app/share/applications && sed -e 's/^Icon=stoke$/Icon=io.github.dresden196.stoke/' stoke-qt/io.github.dresden196.stoke.desktop > /app/share/applications/io.github.dresden196.stoke.desktop
      # The tree has no metainfo for the KDE window yet; the GNOME one with
      # the ids and the one sentence that names the toolkit swapped.
      - cd "$FLATPAK_BUILDER_BUILDDIR" && install -d /app/share/metainfo && sed -e 's/io\.github\.dresden196\.stoke\.gtk/io.github.dresden196.stoke/g' -e 's/the GNOME window over the stoke engine; a KDE window is/the KDE window over the stoke engine; a GNOME window is/' stoke-gtk/io.github.dresden196.stoke.gtk.metainfo.xml > /app/share/metainfo/io.github.dresden196.stoke.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip: [.git, dist, build-dir, .flatpak-builder, tests, packaging/appimage/AppDir, packaging/appimage/appimage-build, stoke/src, stoke/pkg, stoke-gtk/src, stoke-gtk/pkg, stoke-gtk/stoke_gtk, stoke-gtk/bin, stoke-qt/src, stoke-qt/pkg]
