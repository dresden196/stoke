<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3f46"/>
      <stop offset="100%" stop-color="#22252a"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9ecf0"/>
      <stop offset="100%" stop-color="#b9bfc8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e8431f"/>
      <stop offset="55%" stop-color="#f58a1f"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <!-- A flash drive lying plug-right, dark body, with a flame rising off
       it: the drive you stoke. The two plug slots keep it readable as USB-A
       at small sizes; the flame is one path so it stays crisp at 16px. -->
  <rect x="33" y="19.5" width="11" height="11" rx="1.6" fill="url(#plug)"/>
  <rect x="37" y="22" width="5" height="1.8" rx="0.9" fill="#22252a" fill-opacity="0.45"/>
  <rect x="37" y="26.2" width="5" height="1.8" rx="0.9" fill="#22252a" fill-opacity="0.45"/>
  <rect x="4" y="16" width="30" height="18" rx="4.5" fill="url(#body)"/>
  <circle cx="9.2" cy="25" r="1.7" fill="#ffd166" fill-opacity="0.95"/>
  <path d="M22.5 31.5 C18.2 28.6 18.6 23.2 22.4 19.8 C22.1 22.4 23 23.9 24.4 24.6
           C24.1 21.6 25.5 18.6 28.2 16.5 C27.6 20.2 29.9 21.5 30.4 25.1
           C30.9 28.6 28.5 31.3 25.6 31.9 C27.1 30.5 27.2 28.6 26 27.2
           C25.6 29.1 24.5 30.4 22.5 31.5 Z" fill="url(#flame)"/>
</svg>
